<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Juego con WASD</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      background: #222;
      border: 2px solid #555;
    }
  </style>
</head>
<body>
  <canvas id="game" width="600" height="400"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const player = {
      x: 50,
      y: 50,
      radius: 15,
      speed: 2,
      color: "#4CAF50"
    };

    const obstacles = [
      { x: 200, y: 100, width: 100, height: 20 },
      { x: 100, y: 250, width: 300, height: 20 }
    ];

    const keys = { w: false, a: false, s: false, d: false };

    document.addEventListener("keydown", e => {
      const k = e.key.toLowerCase();
      if (keys.hasOwnProperty(k)) keys[k] = true;
    });

    document.addEventListener("keyup", e => {
      const k = e.key.toLowerCase();
      if (keys.hasOwnProperty(k)) keys[k] = false;
    });

    function circleRectCollision(circle, rect) {
      const closestX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.width));
      const closestY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.height));
      const dx = circle.x - closestX;
      const dy = circle.y - closestY;
      return dx * dx + dy * dy < circle.radius * circle.radius;
    }

    function canMoveTo(x, y) {
      const temp = { x, y, radius: player.radius };
      for (const obs of obstacles) {
        if (circleRectCollision(temp, obs)) return false;
      }
      return x > player.radius && x < canvas.width - player.radius &&
             y > player.radius && y < canvas.height - player.radius;
    }

    function update() {
      let newX = player.x;
      let newY = player.y;
      if (keys.w) newY -= player.speed;
      if (keys.s) newY += player.speed;
      if (keys.a) newX -= player.speed;
      if (keys.d) newX += player.speed;
      if (canMoveTo(newX, newY)) {
        player.x = newX;
        player.y = newY;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#555";
      for (const obs of obstacles) {
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
      }
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = player.color;
      ctx.fill();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
