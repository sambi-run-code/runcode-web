<!DOCTYPE html>
<html lang="es">
<head>

    :root {

      --panel: #1a1f1d;

    body {

      background: var(--bg);

      display: flex;

      height: 100vh;
    }

      background: var(--panel);
      border-bottom: 1px solid var(--border);

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr 260px;
      gap: 14px;
      padding: 14px;
      box-sizing: border-box;
    }
