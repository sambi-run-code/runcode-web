<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SelektRunCode - Editor</title>

  <style>
    :root {
      --bg: #0f1412;
      --panel: #1a1f1d;
      --panel-light: #222826;
      --accent: #3ba37b;
      --accent-light: #4fcf9c;
      --text: #e8f1ec;
      --text-dim: #9aa7a0;
      --border: #2a2f2d;
      --radius: 10px;
    }

    body {
      margin: 0;
      font-family: "Inter", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 14px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      font-size: 18px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-right {
      display: flex;
      gap: 14px;
      font-size: 20px;
      color: var(--accent-light);
    }

    .header-icon {
      cursor: pointer;
      transition: 0.2s;
    }

    .header-icon:hover {
      color: var(--accent);
      transform: scale(1.15);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr 260px;
      gap: 14px;
      padding: 14px;
      box-sizing: border-box;
    }

    .editor-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--panel);
      padding: 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .editor-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    select {
      background: var(--panel-light);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: var(--radius);
      font-size: 14px;
      outline: none;
    }

    button {
      background: var(--accent);
      color: #0b0f0d;
      border: none;
      padding: 8px 14px;
      border-radius: var(--radius);
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
    }

    button:hover {
      background: var(--accent-light);
    }

    .status-text {
      font-size: 12px;
      color: var(--text-dim);
    }

    textarea {
      flex: 1;
      background: #0d1210;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: var(--radius);
      font-family: monospace;
      font-size: 13px;
      resize: none;
      outline: none;
    }

    .console-panel {
      display: flex;
      flex-direction: column;
      background: var(--panel);
      padding: 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .console-title {
      font-size: 15px;
      margin-bottom: 8px;
      color: var(--accent-light);
      font-weight: 600;
    }

    .console-output {
      flex: 1;
      background: #0d1210;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
      overflow-y: auto;
      color: var(--text-dim);
    }

    .ads-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: var(--text-dim);
      font-size: 14px;
    }

    .ads-placeholder {
      background: #0d1210;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-light);
      font-size: 14px;
      text-align: center;
      padding: 10px;
    }

    /* iframe oculto para renderizar HTML */
    #html-preview {
      display: none;
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }

  </style>
</head>

<body>

  <header>
    <div class="header-left">
      SelektRunCode — Editor Minimalista
    </div>

    <div class="header-right">
      <span class="header-icon">⚙️</span>
      <span class="header-icon">🧩</span>
    </div>
  </header>

  <main>

    <div class="editor-panel">
      <div class="editor-top">
        <label for="language">Lenguaje:</label>
        <select id="language">
          <option value="python">Python</option>
          <option value="javascript">JavaScript</option>
          <option value="html">HTML</option>
          <option value="cpp">C++</option>
          <option value="java">Java</option>
          <option value="php">PHP</option>
        </select>

        <button id="run-btn">Ejecutar</button>
      </div>

      <div class="status-text" id="status-text">
        Selecciona un lenguaje y escribe tu código. De momento solo HTML se ejecuta de verdad.
      </div>

      <textarea id="editor" placeholder="Escribe tu código aquí..."></textarea>
    </div>

    <div class="console-panel">
      <div class="console-title">Consola</div>
      <div id="console" class="console-output">Aquí aparecerá la salida...</div>

      <!-- iframe oculto para previsualizar HTML cuando el lenguaje sea HTML -->
      <iframe id="html-preview"></iframe>
    </div>

    <div class="ads-panel">
      <strong>Publicidad</strong>
      <div class="ads-placeholder">
        Aquí irá tu bloque de Google Ads
      </div>
    </div>

  </main>

  <script>
    const languageSelect = document.getElementById('language');
    const editor = document.getElementById('editor');
    const consoleOutput = document.getElementById('console');
    const runBtn = document.getElementById('run-btn');
    const statusText = document.getElementById('status-text');
    const htmlPreview = document.getElementById('html-preview');

    function setStatus(text) {
      statusText.textContent = text;
    }

    function setConsole(text) {
      consoleOutput.textContent = text;
    }

    runBtn.addEventListener('click', () => {
      const lang = languageSelect.value;
      const code = editor.value;

      if (!code.trim()) {
        setConsole('No hay código para ejecutar.');
        return;
      }

      if (lang === 'html') {
        setStatus('Ejecutando HTML...');
        setConsole('Renderizando HTML en la vista integrada...');
        htmlPreview.style.display = 'block';
        const doc = htmlPreview.contentDocument || htmlPreview.contentWindow.document;
        doc.open();
        doc.write(code);
        doc.close();
      } else {
        setStatus('Este lenguaje aún no está implementado. Iremos añadiéndolos poco a poco.');
        setConsole('El lenguaje seleccionado todavía no tiene ejecución activa.\n\nDe momento solo HTML se ejecuta de verdad.');
        htmlPreview.style.display = 'none';
      }
    });

    editor.value = "<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <title>Prueba HTML</title>\n</head>\n<body>\n  <h1 style=\"color: seagreen;\">Hola desde SelektRunCode</h1>\n  <p>Este HTML se está renderizando dentro de la consola.</p>\n</body>\n</html>";
  </script>

</body>
</html>
