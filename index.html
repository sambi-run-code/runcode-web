<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mapa con círculo y obstáculos</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    #gameContainer {
      position: relative;
      border: 2px solid #444;
      background: #222;
    }

    canvas {
      display: block;
      background: #1a1a1a;
    }

    #info {
      position: absolute;
      top: 5px;
      left: 5px;
      padding: 4px 8px;
      background: rgba(0, 0, 0, 0.6);
      font-size: 12px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <div id="info">Mueve con W A S D</div>
    <canvas id="game" width="800" height="500"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // Círculo (jugador)
    const player = {
      x: 80,
      y: 80,
      radius: 15,
      speed: 3,
      color: "#4CAF50"
    };

    // Obstáculos (rectángulos)
    const obstacles = [
      { x: 150, y: 50, width: 200, height: 40 },
      { x: 450, y: 120, width: 40, height: 250 },
      { x: 250, y: 300, width: 300, height: 40 },
      { x: 80,  y: 200, width: 120, height: 40 }
    ];

    // Teclas pulsadas
    const keys = {
      w: false,
      a: false,
      s: false,
      d: false
    };

    document.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      if (key === "w" || key === "a" || key === "s" || key === "d") {
        keys[key] = true;
      }
    });

    document.addEventListener("keyup", (e) => {
      const key = e.key.toLowerCase();
      if (key === "w" || key === "a" || key === "s" || key === "d") {
        keys[key] = false;
      }
    });

    // Detección de colisión círculo-rectángulo
    function circleRectCollision(circle, rect) {
      // Punto más cercano del rectángulo al centro del círculo
      const closestX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.width));
      const closestY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.height));

      const dx = circle.x - closestX;
      const dy = circle.y - closestY;

      return (dx * dx + dy * dy) < (circle.radius * circle.radius);
    }

    function canMoveTo(newX, newY) {
      const tempCircle = {
        x: newX,
        y: newY,
        radius: player.radius
      };

      // Limites del canvas
      if (
        newX - player.radius < 0 ||
        newX + player.radius > canvas.width ||
        newY - player.radius < 0 ||
        newY + player.radius > canvas.height
      ) {
        return false;
      }

      // Comprobar colisión con cada obstáculo
      for (const obs of obstacles) {
        if (circleRectCollision(tempCircle, obs)) {
          return false;
        }
      }

      return true;
    }

    function update() {
      let newX = player.x;
      let newY = player.y;

      if (keys.w) newY -= player.speed;
      if (keys.s) newY += player.speed;
      if (keys.a) newX -= player.speed;
      if (keys.d) newX += player.speed;

      if (canMoveTo(newX, newY)) {
        player.x = newX;
        player.y = newY;
      }
    }

    function drawPlayer() {
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = player.color;
      ctx.fill();
      ctx.closePath();
    }

    function drawObstacles() {
      ctx.fillStyle = "#555";
      for (const obs of obstacles) {
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
      }
    }

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      update();
      drawObstacles();
      drawPlayer();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
