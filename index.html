<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SelektRunCode - Editor v0.3</title>

  <!-- Pyodide -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>

  <style>
    :root {
      --bg: #0f1412;
      --panel: #1a1f1d;
      --panel-light: #222826;
      --accent: #3ba37b;
      --accent-light: #4fcf9c;
      --text: #e8f1ec;
      --text-dim: #9aa7a0;
      --border: #2a2f2d;
      --radius: 10px;
      --error: #ff4d4d;
      --btn-bg: #3ba37b;
      --btn-hover: #4fcf9c;
      --btn-text: #0b0f0d;
    }

    /* Tema claro */
    .light {
      --bg: #f5f5f5;
      --panel: #ffffff;
      --panel-light: #e9e9e9;
      --accent: #3ba37b;
      --accent-light: #2e8f6a;
      --text: #1a1a1a;
      --text-dim: #555;
      --border: #d0d0d0;
      --btn-bg: #3ba37b;
      --btn-hover: #2e8f6a;
      --btn-text: #ffffff;
    }

    body {
      margin: 0;
      font-family: "Inter", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    header {
      padding: 14px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      font-size: 18px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.3s, border 0.3s;
    }

    .header-right {
      display: flex;
      gap: 14px;
      font-size: 20px;
      color: var(--accent-light);
      align-items: center;
    }

    .header-icon {
      cursor: pointer;
      transition: 0.2s;
    }

    .header-icon:hover {
      color: var(--accent);
      transform: scale(1.15);
    }

    #theme-toggle {
      font-size: 22px;
      cursor: pointer;
      transition: 0.2s;
    }

    #theme-toggle:hover {
      transform: scale(1.2);
      color: var(--accent-light);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr 260px;
      gap: 14px;
      padding: 14px;
      box-sizing: border-box;
    }

    .editor-panel, .console-panel, .ads-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: background 0.3s, border 0.3s;
    }

    textarea {
      flex: 1;
      background: var(--panel-light);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: var(--radius);
      font-family: monospace;
      font-size: 13px;
      resize: none;
      outline: none;
      transition: background 0.3s, color 0.3s;
    }

    select {
      background: var(--panel-light);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: var(--radius);
      font-size: 14px;
      outline: none;
      transition: background 0.3s, color 0.3s;
    }

    .btn {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: var(--btn-hover);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: scale(0.95);
    }

    #console {
      flex: 1;
      background: var(--panel-light);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
      overflow-y: auto;
      color: var(--text-dim);
      transition: background 0.3s, color 0.3s;
    }

    .error-text {
      color: var(--error);
      font-weight: bold;
    }

    #html-preview {
      display: none;
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }

    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 45px;
      height: 45px;
      margin: -22px;
      border: 4px solid var(--accent-light);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
      z-index: 10;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

<header>
  SelektRunCode — Editor Minimalista
  <div class="header-right">
    <span>v0.3</span>
    <span id="theme-toggle">🌙</span>
    <span class="header-icon">⚙️</span>
    <span class="header-icon">🧩</span>
    <span class="header-icon">📁</span>
    <span class="header-icon">⭐</span>
  </div>
</header>

<main>

  <!-- PANEL EDITOR -->
  <div class="editor-panel">
    <label>Lenguaje:</label>
    <select id="language">
      <option value="html">HTML</option>
      <option value="javascript">JavaScript</option>
      <option value="python">Python</option>
    </select>

    <textarea id="editor"></textarea>

    <button class="btn" id="run-btn">▶ Ejecutar</button>
    <button class="btn" id="clear-console-btn">🧹 Limpiar consola</button>
    <button class="btn" id="fullscreen-btn" style="display:none;">🖥 Pantalla completa</button>
  </div>

  <!-- PANEL CONSOLA -->
  <div class="console-panel" style="position:relative;">
    <div class="loader" id="loader"></div>
    <div id="console">Aquí aparecerá la salida...</div>
    <iframe id="html-preview" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>

  <!-- PANEL PUBLICIDAD -->
  <div class="ads-panel">
    <strong>Publicidad</strong>
    <div style="background:#0d1210; border:1px solid var(--border); border-radius:var(--radius); height:250px; display:flex; align-items:center; justify-content:center; color:var(--accent-light);">
      Aquí irá tu bloque de Google Ads
    </div>
  </div>

</main>

<script>
  const languageSelect = document.getElementById('language');
  const editor = document.getElementById('editor');
  const consoleOutput = document.getElementById('console');
  const runBtn = document.getElementById('run-btn');
  const clearBtn = document.getElementById('clear-console-btn');
  const fullscreenBtn = document.getElementById('fullscreen-btn');
  const htmlPreview = document.getElementById('html-preview');
  const loader = document.getElementById('loader');
  const themeToggle = document.getElementById('theme-toggle');

  let pyodide = null;

  loadPyodide().then(p => { pyodide = p; });

  function showLoader() { loader.style.display = "block"; }
  function hideLoader() { loader.style.display = "none"; }

  function setConsole(text, isError = false) {
    const separator = "\n------------------------------\n";
    if (isError) {
      consoleOutput.innerHTML += separator + `<span class="error-text">${text}</span>`;
    } else {
      consoleOutput.textContent += separator + text;
    }
    consoleOutput.scrollTop = consoleOutput.scrollHeight;
  }

  clearBtn.addEventListener("click", () => {
    consoleOutput.textContent = "Consola limpiada.";
  });

  /* -------------------------
     GUARDADO AUTOMÁTICO
  --------------------------*/

  editor.value = localStorage.getItem("editorCode") || "// Escribe tu código aquí";

  editor.addEventListener("input", () => {
    localStorage.setItem("editorCode", editor.value);
  });

  /* -------------------------
     TEMA CLARO/OSCURO
  --------------------------*/

  if (localStorage.getItem("theme") === "light") {
    document.body.classList.add("light");
    themeToggle.textContent = "🌞";
  }

  themeToggle.addEventListener("click", () => {
    document.body.classList.toggle("light");
    const isLight = document.body.classList.contains("light");
    themeToggle.textContent = isLight ? "🌞" : "🌙";
    localStorage.setItem("theme", isLight ? "light" : "dark");
  });

  /* -------------------------
     EJECUTAR
  --------------------------*/

  runBtn.addEventListener('click', async () => {
    const lang = languageSelect.value;
    const code = editor.value;

    showLoader();
    setConsole("Procesando...");

    setTimeout(async () => {
      try {
        if (lang === "html") {
          const doc = htmlPreview.contentDocument || htmlPreview.contentWindow.document;
          doc.open(); doc.write(code); doc.close();
          htmlPreview.style.display = "block";
          fullscreenBtn.style.display = "inline-block";
          setConsole("Renderizado HTML");
        }

        else if (lang === "javascript") {
          htmlPreview.style.display = "none";
          fullscreenBtn.style.display = "none";
          try {
            const result = new Function(code)();
            setConsole("Resultado JS:\n" + result);
          } catch (err) {
            setConsole("Error JS:\n" + err, true);
          }
        }

        else if (lang === "python") {
          htmlPreview.style.display = "none";
          fullscreenBtn.style.display = "none";

          if (!pyodide) {
            setConsole("Pyodide aún no cargado", true);
            return;
          }

          try {
            const result = await pyodide.runPythonAsync(code);
            setConsole("Salida Python:\n" + result);
          } catch (err) {
            setConsole("Error Python:\n" + err, true);
          }
        }

      } finally {
        hideLoader();
      }
    }, 200);
  });

  fullscreenBtn.addEventListener('click', () => {
    htmlPreview.requestFullscreen();
  });
</script>

</body>
</html>
