<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SelektRunCode - Editor</title>

  <style>
    :root {
      --bg: #0f1412;
      --panel: #1a1f1d;
      --panel-light: #222826;
      --accent: #3ba37b;
      --accent-light: #4fcf9c;
      --text: #e8f1ec;
      --text-dim: #9aa7a0;
      --border: #2a2f2d;
      --radius: 10px;
      --error: #ff4d4d;
    }

    body {
      margin: 0;
      font-family: "Inter", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 14px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      font-size: 18px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-right {
      display: flex;
      gap: 14px;
      font-size: 20px;
      color: var(--accent-light);
    }

    .header-icon {
      cursor: pointer;
      transition: 0.2s;
    }

    .header-icon:hover {
      color: var(--accent);
      transform: scale(1.15);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr 260px;
      gap: 14px;
      padding: 14px;
      box-sizing: border-box;
    }

    .editor-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--panel);
      padding: 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .editor-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    select {
      background: var(--panel-light);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: var(--radius);
      font-size: 14px;
      outline: none;
    }

    button {
      background: var(--accent);
      color: #0b0f0d;
      border: none;
      padding: 8px 14px;
      border-radius: var(--radius);
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
    }

    button:hover {
      background: var(--accent-light);
    }

    .status-text {
      font-size: 12px;
      color: var(--text-dim);
    }

    textarea {
      flex: 1;
      background: #0d1210;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: var(--radius);
      font-family: monospace;
      font-size: 13px;
      resize: none;
      outline: none;
    }

    .console-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      padding: 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .console-title {
      font-size: 15px;
      margin-bottom: 8px;
      color: var(--accent-light);
      font-weight: 600;
    }

    .console-output {
      flex: 1;
      background: #0d1210;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
      overflow-y: auto;
      color: var(--text-dim);
    }

    .error-text {
      color: var(--error);
      font-weight: bold;
    }

    .ads-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: var(--text-dim);
      font-size: 14px;
    }

    .ads-placeholder {
      background: #0d1210;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-light);
      font-size: 14px;
      text-align: center;
      padding: 10px;
    }

    #html-preview {
      display: none;
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }

    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 45px;
      height: 45px;
      margin: -22px;
      border: 4px solid var(--accent-light);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
      z-index: 10;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* pequeños ajustes responsivos */
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; grid-auto-rows: minmax(200px, auto); }
      .ads-panel { order: 3; }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-left">
      SelektRunCode — Editor Minimalista
    </div>

    <div class="header-right">
      <span class="header-icon">⚙️</span>
      <span class="header-icon">🧩</span>
    </div>
  </header>

  <main>

    <div class="editor-panel">
      <div class="editor-top">
        <label for="language">Lenguaje:</label>
        <select id="language">
          <option value="python">Python</option>
          <option value="javascript">JavaScript</option>
          <option value="html">HTML</option>
          <option value="cpp">C++</option>
          <option value="java">Java</option>
          <option value="php">PHP</option>
        </select>

        <button id="run-btn">Ejecutar</button>
        <button id="fullscreen-btn" style="display:none;">Pantalla Completa</button>
      </div>

      <div class="status-text" id="status-text">
        Selecciona un lenguaje y escribe tu código.
      </div>

      <textarea id="editor" placeholder="Escribe tu código aquí..."></textarea>
    </div>

    <div class="console-panel">
      <div class="loader" id="loader"></div>

      <div class="console-title">Consola</div>
      <div id="console" class="console-output">Aquí aparecerá la salida...</div>

      <iframe id="html-preview" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>

    <div class="ads-panel">
      <strong>Publicidad</strong>
      <div class="ads-placeholder">
        Aquí irá tu bloque de Google Ads
      </div>
    </div>

  </main>

  <!-- Pyodide para Python en el navegador -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>

  <script>
    const languageSelect = document.getElementById('language');
    const editor = document.getElementById('editor');
    const consoleOutput = document.getElementById('console');
    const runBtn = document.getElementById('run-btn');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const statusText = document.getElementById('status-text');
    const htmlPreview = document.getElementById('html-preview');
    const loader = document.getElementById('loader');

    function setStatus(text) {
      statusText.textContent = text;
    }

    function setConsole(text, isError = false) {
      if (isError) {
        consoleOutput.innerHTML = `<span class="error-text">${escapeHtml(text)}</span>`;
      } else {
        consoleOutput.textContent = text;
      }
    }

    function appendConsole(text, isError = false) {
      if (isError) {
        consoleOutput.innerHTML += `\n<span class="error-text">${escapeHtml(text)}</span>`;
      } else {
        consoleOutput.textContent += '\n' + text;
      }
      consoleOutput.scrollTop = consoleOutput.scrollHeight;
    }

    function showLoader() {
      loader.style.display = "block";
    }

    function hideLoader() {
      loader.style.display = "none";
    }

    function escapeHtml(unsafe) {
      return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // SANDBOX JAVASCRIPT (Web Worker)
    const jsWorkerCode = `
      self.onmessage = function(e) {
        const code = e.data;
        try {
          // limit access by running inside worker global scope
          const fn = new Function(code);
          const result = fn();
          self.postMessage({ type: "result", result: String(result) });
        } catch (err) {
          self.postMessage({ type: "error", error: String(err) });
        }
      };
    `;

    const jsBlob = new Blob([jsWorkerCode], { type: "application/javascript" });
    const jsWorker = new Worker(URL.createObjectURL(jsBlob));

    jsWorker.onmessage = (e) => {
      hideLoader();
      if (e.data.type === "result") {
        setConsole("Resultado JS:\n" + e.data.result);
      } else {
        setConsole("Error en JavaScript:\n" + e.data.error, true);
      }
    };

    // PYODIDE SETUP
    let pyodideReady = false;
    let pyodide = null;

    async function loadPyodideAndPackages() {
      setStatus('Cargando Pyodide...');
      try {
        pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.23.4/full/" });
        pyodideReady = true;
        setStatus('Pyodide listo');
      } catch (err) {
        setConsole('Error cargando Pyodide: ' + err, true);
        setStatus('Error cargando Python');
      }
    }

    // Inicia la carga de Pyodide en background
    loadPyodideAndPackages();

    // JUDGE0 CONFIGURACION
    // Debes configurar tu API host y API key si usas RapidAPI o tu instancia de Judge0
    // Ejemplo con RapidAPI:
    // const JUDGE0_HOST = 'judge0-ce.p.rapidapi.com';
    // const JUDGE0_BASE = 'https://judge0-ce.p.rapidapi.com';
    // const JUDGE0_KEY = 'TU_RAPIDAPI_KEY_AQUI';
    //
    // Si tienes una instancia propia de Judge0 sin RapidAPI, ajusta JUDGE0_BASE y elimina el header 'X-RapidAPI-Key'
    const JUDGE0_BASE = 'https://judge0-ce.p.rapidapi.com'; // cambiar si usas otra instancia
    const JUDGE0_HOST = 'judge0-ce.p.rapidapi.com'; // cambiar si usas otra instancia
    const JUDGE0_KEY = ''; // <-- PON AQUÍ TU RAPIDAPI KEY o la clave necesaria

    // Mapeo de lenguaje a language_id de Judge0
    // Nota: estos IDs son los más comunes en Judge0 CE. Si tu instancia usa otros IDs, ajústalos.
    const judge0LanguageMap = {
      'cpp': 54,    // C++ (GCC 9.2.0 por ejemplo)
      'java': 62,   // Java (OpenJDK 13.0.1)
      'php': 68,    // PHP 7.4.1
      // Python y JS también pueden ejecutarse en Judge0 si se desea
    };

    async function createJudge0Submission(sourceCode, languageId, stdin = '') {
      const url = `${JUDGE0_BASE}/submissions?base64_encoded=false&wait=false`;
      const body = {
        source_code: sourceCode,
        language_id: languageId,
        stdin: stdin
      };

      const headers = {
        'Content-Type': 'application/json'
      };

      // Si usas RapidAPI añade estos headers
      if (JUDGE0_KEY) {
        headers['X-RapidAPI-Key'] = JUDGE0_KEY;
        headers['X-RapidAPI-Host'] = JUDGE0_HOST;
      }

      const resp = await fetch(url, {
        method: 'POST',
        headers,
        body: JSON.stringify(body)
      });

      if (!resp.ok) {
        const text = await resp.text();
        throw new Error('Error creando submission Judge0: ' + resp.status + ' ' + text);
      }

      return resp.json();
    }

    async function getJudge0Submission(token) {
      const url = `${JUDGE0_BASE}/submissions/${token}?base64_encoded=false`;
      const headers = {};

      if (JUDGE0_KEY) {
        headers['X-RapidAPI-Key'] = JUDGE0_KEY;
        headers['X-RapidAPI-Host'] = JUDGE0_HOST;
      }

      const resp = await fetch(url, { headers });
      if (!resp.ok) {
        const text = await resp.text();
        throw new Error('Error consultando submission Judge0: ' + resp.status + ' ' + text);
      }
      return resp.json();
    }

    async function runJudge0Code(sourceCode, langKey) {
      if (!JUDGE0_KEY) {
        throw new Error('Judge0 no está configurado. Añade tu clave en la variable JUDGE0_KEY.');
      }
      const languageId = judge0LanguageMap[langKey];
      if (!languageId) throw new Error('Language ID no configurado para ' + langKey);

      setStatus('Enviando a Judge0...');
      const submission = await createJudge0Submission(sourceCode, languageId);
      const token = submission.token;
      setStatus('Esperando resultado de Judge0...');

      // Polling simple
      for (let i = 0; i < 40; i++) {
        await new Promise(r => setTimeout(r, 800));
        const result = await getJudge0Submission(token);
        if (result.status && result.status.id >= 3) { // 1-2 en cola/running, >=3 terminado
          return result;
        }
      }
      throw new Error('Tiempo de espera agotado para Judge0');
    }

    // EVENTO EJECUTAR
    runBtn.addEventListener('click', async () => {
      const lang = languageSelect.value;
      const code = editor.value;

      showLoader();
      setConsole("Procesando...");

      // pequeña latencia para mostrar loader
      setTimeout(async () => {
        if (!code.trim()) {
          hideLoader();
          setConsole('No hay código para ejecutar.', true);
          return;
        }

        try {
          if (lang === 'html') {
            setStatus('Ejecutando HTML...');
            setConsole('Renderizando HTML...');
            htmlPreview.style.display = 'block';
            fullscreenBtn.style.display = 'inline-block';

            const doc = htmlPreview.contentDocument || htmlPreview.contentWindow.document;
            doc.open();
            doc.write(code);
            doc.close();

            hideLoader();
          }

          else if (lang === 'javascript') {
            setStatus('Ejecutando JavaScript en sandbox...');
            htmlPreview.style.display = 'none';
            fullscreenBtn.style.display = 'none';

            jsWorker.postMessage(code);
          }

          else if (lang === 'python') {
            setStatus('Ejecutando Python en Pyodide...');
            htmlPreview.style.display = 'none';
            fullscreenBtn.style.display = 'none';

            if (!pyodideReady) {
              setConsole('Pyodide aún no está listo. Espera unos segundos...', true);
              hideLoader();
              return;
            }

            // Envolvemos el código para capturar stdout
            const wrapped = `
import sys, io
_old_stdout = sys.stdout
sys.stdout = io.StringIO()
try:
${code.split('\n').map(line => '    ' + line).join('\n')}
    output = sys.stdout.getvalue()
finally:
    sys.stdout = _old_stdout
output
`;
            try {
              const output = await pyodide.runPythonAsync(wrapped);
              hideLoader();
              setConsole(String(output || ''));
              setStatus('Ejecución Python finalizada');
            } catch (err) {
              hideLoader();
              setConsole('Error en Python:\n' + String(err), true);
              setStatus('Error en Python');
            }
          }

          else if (lang === 'cpp' || lang === 'java' || lang === 'php') {
            setStatus('Ejecutando ' + lang + ' en Judge0...');
            htmlPreview.style.display = 'none';
            fullscreenBtn.style.display = 'none';

            try {
              const result = await runJudge0Code(code, lang);
              hideLoader();

              // Construir salida legible
              let out = '';
              if (result.stdout) out += 'Salida:\n' + result.stdout + '\n';
              if (result.stderr) out += 'Errores runtime:\n' + result.stderr + '\n';
              if (result.compile_output) out += 'Errores compilación:\n' + result.compile_output + '\n';
              if (result.message) out += 'Mensaje:\n' + result.message + '\n';
              if (!out.trim()) out = 'Sin salida. Estado: ' + (result.status ? result.status.description : JSON.stringify(result.status));

              setConsole(out);
              setStatus('Resultado Judge0: ' + (result.status ? result.status.description : 'Desconocido'));
            } catch (err) {
              hideLoader();
              setConsole('Error Judge0:\n' + String(err), true);
              setStatus('Error Judge0');
            }
          }

          else {
            hideLoader();
            setStatus('Este lenguaje aún no está implementado.');
            setConsole('Error: este lenguaje todavía no está disponible.', true);
          }
        } catch (err) {
          hideLoader();
          setConsole('Error inesperado:\n' + String(err), true);
          setStatus('Error inesperado');
        }
      }, 300);
    });

    // FULLSCREEN
    fullscreenBtn.addEventListener('click', () => {
      if (htmlPreview.requestFullscreen) {
        htmlPreview.requestFullscreen();
      } else if (htmlPreview.webkitRequestFullscreen) {
        htmlPreview.webkitRequestFullscreen();
      } else if (htmlPreview.msRequestFullscreen) {
        htmlPreview.msRequestFullscreen();
      }
    });

    // Ejemplo inicial
    editor.value = `// JavaScript
console.log('Hola desde JavaScript sandbox');


// Python ejemplo
# print('Hola desde Python')
// Para probar Python selecciona Python en el selector y reemplaza este contenido

// C++ ejemplo
/* #include <iostream>
int main() {
  std::cout << "Hola desde C++" << std::endl;
  return 0;
} */

// Java ejemplo
/* public class Main {
  public static void main(String[] args) {
    System.out.println("Hola desde Java");
  }
} */

// PHP ejemplo
/* <?php
echo "Hola desde PHP\\n";
?> */
  </script>

</body>
</html>
